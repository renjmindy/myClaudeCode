<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
    }

    h1 {
      font-size: 2rem;
      color: #4ecca3;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #scoreboard {
      display: flex;
      gap: 40px;
      font-size: 1rem;
      color: #a0a0c0;
    }

    #scoreboard span { color: #4ecca3; font-weight: bold; }

    #game-wrapper {
      position: relative;
    }

    canvas {
      display: block;
      border: 2px solid #4ecca3;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(78, 204, 163, 0.3);
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(26, 26, 46, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 4px;
    }

    #overlay h2 {
      font-size: 1.8rem;
      color: #e94560;
    }

    #overlay p {
      color: #a0a0c0;
      font-size: 0.95rem;
    }

    #overlay .final-score {
      font-size: 1.1rem;
      color: #4ecca3;
    }

    button {
      margin-top: 8px;
      padding: 10px 28px;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s;
    }

    button:hover { background: #38b28d; }

    #controls {
      font-size: 0.8rem;
      color: #555577;
      text-align: center;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <h1>Snake</h1>

  <div id="scoreboard">
    SCORE: <span id="score">0</span>
    &nbsp;&nbsp;|&nbsp;&nbsp;
    BEST: <span id="best">0</span>
    &nbsp;&nbsp;|&nbsp;&nbsp;
    LEVEL: <span id="level">1</span>
  </div>

  <div id="game-wrapper">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">SNAKE</h2>
      <p id="overlay-msg">Use arrow keys or WASD to move</p>
      <p class="final-score" id="final-score" style="display:none"></p>
      <button id="start-btn">START GAME</button>
    </div>
  </div>

  <div id="controls">
    Arrow Keys / WASD — Move &nbsp;|&nbsp; P / Space — Pause
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const COLS = 20, ROWS = 20;
    const CELL = canvas.width / COLS;

    const scoreEl  = document.getElementById('score');
    const bestEl   = document.getElementById('best');
    const levelEl  = document.getElementById('level');
    const overlay  = document.getElementById('overlay');
    const titleEl  = document.getElementById('overlay-title');
    const msgEl    = document.getElementById('overlay-msg');
    const finalEl  = document.getElementById('final-score');
    const startBtn = document.getElementById('start-btn');

    let snake, dir, nextDir, foods, superFood, score, best, level, speed, loopId, paused, running, pendingGrowth;

    best = parseInt(localStorage.getItem('snakeBest') || '0');
    bestEl.textContent = best;

    function init() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      level = 1;
      speed = 150;
      paused = false;
      running = true;
      pendingGrowth = 0;
      scoreEl.textContent = 0;
      levelEl.textContent = 1;
      foods = [];
      superFood = null;
      placeFood();
      placeFood();
      placeSuperFood();
      overlay.style.display = 'none';
      if (loopId) clearTimeout(loopId);
      loop();
    }

    function randomPos() {
      return { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    }

    function isFree(pos) {
      return !snake.some(s => s.x === pos.x && s.y === pos.y) &&
             !foods.some(f => f.x === pos.x && f.y === pos.y) &&
             !(superFood && superFood.x === pos.x && superFood.y === pos.y);
    }

    function placeFood() {
      let pos;
      do { pos = randomPos(); } while (!isFree(pos));
      foods.push(pos);
    }

    function placeSuperFood() {
      let pos;
      do { pos = randomPos(); } while (!isFree(pos));
      superFood = pos;
    }

    function loop() {
      if (!running || paused) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wrap around walls
      head.x = (head.x + COLS) % COLS;
      head.y = (head.y + ROWS) % ROWS;
      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      const eatenIndex = foods.findIndex(f => f.x === head.x && f.y === head.y);
      const ateSuper = superFood && head.x === superFood.x && head.y === superFood.y;

      if (eatenIndex !== -1 || ateSuper) {
        const points = ateSuper ? 30 * level : 10 * level;
        if (ateSuper) {
          placeSuperFood();
          pendingGrowth += 1; // grow by 2 total
        } else {
          foods.splice(eatenIndex, 1);
          placeFood(); // grow by 1 (no pendingGrowth)
        }
        score += points;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem('snakeBest', best);
        }
        level = Math.floor(score / 100) + 1;
        levelEl.textContent = level;
        speed = Math.max(60, 150 - (level - 1) * 10);
      } else {
        if (pendingGrowth > 0) {
          pendingGrowth--;
        } else {
          snake.pop();
        }
      }

      draw();
      loopId = setTimeout(loop, speed);
    }

    function draw() {
      // Background
      ctx.fillStyle = '#0f0f1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines (subtle)
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      }
      for (let j = 0; j <= ROWS; j++) {
        ctx.beginPath(); ctx.moveTo(0, j * CELL); ctx.lineTo(canvas.width, j * CELL); ctx.stroke();
      }

      // Normal food
      foods.forEach(food => {
        const fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
        ctx.fillStyle = '#e94560';
        ctx.beginPath();
        ctx.arc(fx, fy, CELL / 2 - 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowColor = '#e94560';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Super food (gold star)
      if (superFood) {
        const cx = superFood.x * CELL + CELL / 2, cy = superFood.y * CELL + CELL / 2;
        const spikes = 5, outerR = CELL / 2 - 1, innerR = CELL / 4;
        ctx.fillStyle = '#ffd700';
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        for (let i = 0; i < spikes * 2; i++) {
          const angle = (i * Math.PI) / spikes - Math.PI / 2;
          const r = i % 2 === 0 ? outerR : innerR;
          i === 0 ? ctx.moveTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle))
                  : ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
        }
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Snake
      snake.forEach((seg, i) => {
        const t = i / snake.length;
        const r = Math.round(78 + (26 - 78) * t);
        const g = Math.round(204 + (180 - 204) * t);
        const b = Math.round(163 + (140 - 163) * t);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.shadowColor = i === 0 ? '#4ecca3' : 'transparent';
        ctx.shadowBlur = i === 0 ? 8 : 0;
        const pad = i === 0 ? 1 : 2;
        ctx.beginPath();
        ctx.roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, i === 0 ? 4 : 3);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Eyes on head
      const hx = snake[0].x * CELL, hy = snake[0].y * CELL;
      ctx.fillStyle = '#1a1a2e';
      const eyeOffset = dir.y !== 0 ? [CELL * 0.28, CELL * 0.72] : [CELL * 0.3, CELL * 0.7];
      const eyeRow    = dir.y !== 0 ? (dir.y > 0 ? CELL * 0.65 : CELL * 0.3) : CELL * 0.3;
      const eyeCol    = dir.x !== 0 ? (dir.x > 0 ? CELL * 0.65 : CELL * 0.3) : null;
      if (dir.x !== 0) {
        ctx.beginPath(); ctx.arc(hx + eyeCol, hy + eyeOffset[0], 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(hx + eyeCol, hy + eyeOffset[1], 2.2, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(hx + eyeOffset[0], hy + eyeRow, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(hx + eyeOffset[1], hy + eyeRow, 2.2, 0, Math.PI * 2); ctx.fill();
      }
    }

    function gameOver() {
      running = false;
      clearTimeout(loopId);
      overlay.style.display = 'flex';
      titleEl.textContent = 'GAME OVER';
      titleEl.style.color = '#e94560';
      msgEl.textContent = '';
      finalEl.style.display = 'block';
      finalEl.textContent = `Score: ${score}  |  Best: ${best}`;
      startBtn.textContent = 'PLAY AGAIN';
    }

    startBtn.addEventListener('click', init);

    document.addEventListener('keydown', e => {
      const map = {
        ArrowUp:    { x: 0,  y: -1 },
        ArrowDown:  { x: 0,  y:  1 },
        ArrowLeft:  { x: -1, y:  0 },
        ArrowRight: { x: 1,  y:  0 },
        w: { x: 0,  y: -1 }, W: { x: 0,  y: -1 },
        s: { x: 0,  y:  1 }, S: { x: 0,  y:  1 },
        a: { x: -1, y:  0 }, A: { x: -1, y:  0 },
        d: { x: 1,  y:  0 }, D: { x: 1,  y:  0 },
      };
      if (e.key === 'p' || e.key === 'P' || e.key === ' ') {
        if (!running) return;
        paused = !paused;
        if (!paused) loop();
        overlay.style.display = paused ? 'flex' : 'none';
        if (paused) {
          titleEl.textContent = 'PAUSED';
          titleEl.style.color = '#4ecca3';
          msgEl.textContent = 'Press P to resume';
          finalEl.style.display = 'none';
          startBtn.style.display = 'none';
        }
        return;
      }
      if (paused && (e.key === 'p' || e.key === 'P' || e.key === ' ')) return;
      if (overlay.style.display !== 'none' && !paused) startBtn.style.display = 'block';
      const d = map[e.key];
      if (!d) return;
      // Prevent reversing
      if (d.x === -dir.x && d.y === -dir.y) return;
      nextDir = d;
      ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key) && e.preventDefault();
    });

    // Resume button visibility fix for pause
    document.addEventListener('keydown', e => {
      if ((e.key === 'p' || e.key === 'P' || e.key === ' ') && !paused) {
        startBtn.style.display = 'none';
      }
    });

    // Initial draw
    (function() {
      ctx.fillStyle = '#0f0f1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    })();
  </script>
</body>
</html>
